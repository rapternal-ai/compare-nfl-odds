services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: auto_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auto_market_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_market"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  auto_market_postgres:
